/* =========================================================

========================================================= */

:root{

    --cream:#f5f1e9;
    --cream-light:#faf8f3;
    --white:#ffffff;

    --brown:#8b6b4d;
    --brown-dark:#634a34;

    --charcoal:#1d1c19;
    --text:#69645d;
    --muted:#999187;

    --border:#e6dfd4;

    --gold:#b29367;

    --shadow:
        0 25px 70px rgba(38,30,21,.10);

    --container:1200px;

}


/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"DM Sans",sans-serif;
    color:var(--text);
    background:var(--cream-light);
    overflow-x:hidden;
}

img{
    width:100%;
    display:block;
}

a{
    text-decoration:none;
    color:inherit;
}

button,
input,
textarea,
select{
    font:inherit;
}

.container{
    width:min(92%,var(--container));
    margin:auto;
}


/* =========================================================
   TYPOGRAPHY
========================================================= */

h1,
h2,
h3,
h4{
    font-family:"Playfair Display",serif;
    color:var(--charcoal);
}

h2{
    font-size:clamp(38px,5vw,66px);
    line-height:1.04;
    letter-spacing:-1.5px;
}

p{
    line-height:1.8;
}

.section{
    padding:120px 0;
}

.section-light{
    background:var(--cream-light);
}

.section-dark{
    background:var(--charcoal);
}

.section-head{
    max-width:720px;
    margin-bottom:60px;
}

.kicker{
    display:inline-flex;
    align-items:center;
    gap:10px;

    color:var(--brown);

    font-size:12px;
    font-weight:700;

    letter-spacing:2.2px;
    text-transform:uppercase;

    margin-bottom:17px;
}

.kicker::before{
    content:"";
    width:32px;
    height:1px;
    background:var(--brown);
}


/* =========================================================
   BUTTONS
========================================================= */

.btn{
    min-height:54px;

    padding:0 27px;

    display:inline-flex;
    align-items:center;
    justify-content:center;

    gap:10px;

    border-radius:100px;

    font-size:13px;
    font-weight:700;

    cursor:pointer;

    transition:
        background .3s ease,
        color .3s ease,
        transform .25s ease,
        box-shadow .3s ease;

    will-change:transform;
}

.btn-dark{
    background:var(--charcoal);
    color:white;

    box-shadow:
        0 12px 30px rgba(0,0,0,.13);
}

.btn-dark:hover{
    background:var(--brown-dark);
}

.btn-light{
    background:white;
    color:var(--charcoal);
}

.btn-outline{
    border:1px solid rgba(255,255,255,.5);
    color:white;
    background:rgba(255,255,255,.08);

    backdrop-filter:blur(12px);
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{
    background:var(--charcoal);
    color:#ddd6ca;

    font-size:12px;
}

.topbar-inner{
    min-height:38px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.topbar-right{
    display:flex;
    gap:25px;
}


/* =========================================================
   NAVBAR
========================================================= */

.navbar{
    position:sticky;
    top:0;

    z-index:1000;

    background:rgba(250,248,243,.94);

    backdrop-filter:blur(18px);

    border-bottom:1px solid rgba(230,223,212,.8);

    transition:.3s ease;
}

.navbar.scrolled{
    box-shadow:
        0 12px 35px rgba(0,0,0,.08);
}

.nav-inner{
    height:82px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:30px;
}


/* LOGO */

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-mark{

    width:44px;
    height:44px;

    border:1px solid var(--brown);

    display:grid;
    place-items:center;

    color:var(--brown);

    font-family:"Playfair Display";

    font-weight:700;

    font-size:17px;

    border-radius:4px;
}

.logo-text strong{
    display:block;

    font-family:"Playfair Display";

    color:var(--charcoal);

    font-size:18px;
}

.logo-text span{
    display:block;

    color:var(--brown);

    font-size:9px;

    letter-spacing:2px;

    text-transform:uppercase;

    margin-top:2px;
}


/* NAV LINKS */

.nav-links{
    display:flex;
    align-items:center;
    gap:30px;
}

.nav-links a{
    position:relative;

    font-size:13px;

    font-weight:600;

    color:var(--charcoal);
}

.nav-links a:not(.nav-cta)::after{
    content:"";

    position:absolute;

    left:0;
    bottom:-8px;

    width:0;
    height:1px;

    background:var(--brown);

    transition:.3s ease;
}

.nav-links a:hover::after{
    width:100%;
}

.nav-cta{
    min-height:45px;
    padding:0 20px;
}


/* MENU */

.menu-toggle{
    display:none;

    width:45px;
    height:45px;

    background:white;

    border:1px solid var(--border);

    border-radius:7px;

    cursor:pointer;
}

.menu-toggle span{
    width:20px;
    height:2px;

    display:block;

    background:var(--charcoal);

    margin:4px auto;

    transition:.3s;
}


/* =========================================================
   HERO
========================================================= */

.hero{

    min-height:790px;

    display:flex;
    align-items:center;

    position:relative;

    overflow:hidden;

    background:
        linear-gradient(
            90deg,
            rgba(22,20,17,.91) 0%,
            rgba(22,20,17,.72) 43%,
            rgba(22,20,17,.20) 82%
        ),

        url("https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=2200&q=90")
        center/cover;
}

.hero-content{
    max-width:760px;

    padding:100px 0;

    color:white;
}

.hero .kicker{
    color:#d5b78d;
}

.hero .kicker::before{
    background:#d5b78d;
}

.hero h1{

    color:white;

    font-size:
        clamp(54px,7vw,92px);

    line-height:.98;

    letter-spacing:-3px;

    max-width:850px;
}

.hero h1 span{
    color:#d2b488;
}

.hero p{

    max-width:650px;

    color:#ddd6ca;

    font-size:17px;

    margin:27px 0 34px;
}

.hero-actions{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
}

.hero-stats{

    display:flex;

    gap:40px;

    margin-top:50px;

    flex-wrap:wrap;
}

.hero-stat strong{
    display:block;

    color:white;

    font-family:"Playfair Display";

    font-size:26px;
}

.hero-stat span{
    font-size:11px;

    color:#bdb5aa;

    text-transform:uppercase;

    letter-spacing:1px;
}


/* =========================================================
   INTRO
========================================================= */

.intro{
    margin-top:-55px;

    position:relative;

    z-index:5;
}

.intro-card{

    background:white;

    box-shadow:var(--shadow);

    border:1px solid var(--border);

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    border-radius:5px;

    overflow:hidden;
}

.intro-item{

    padding:30px 27px;

    border-right:1px solid var(--border);

    display:flex;

    gap:15px;

    align-items:center;
}

.intro-item:last-child{
    border-right:none;
}

.intro-icon{

    width:45px;
    height:45px;

    border-radius:50%;

    display:grid;
    place-items:center;

    color:var(--brown);

    background:var(--cream);

    flex-shrink:0;
}

.intro-item strong{
    display:block;

    color:var(--charcoal);

    font-size:13px;
}

.intro-item span{
    font-size:11px;

    color:var(--muted);
}


/* =========================================================
   ABOUT
========================================================= */

.about-grid{

    display:grid;

    grid-template-columns:
        .95fr 1.05fr;

    gap:90px;

    align-items:center;
}

.about-images{
    position:relative;
}

.about-main{

    height:620px;

    object-fit:cover;

    border-radius:4px;
}

.about-small{

    position:absolute;

    width:230px;

    height:260px;

    object-fit:cover;

    right:-35px;

    bottom:-40px;

    border:12px solid var(--cream-light);
}

.about-copy p{
    margin-top:20px;
}

.about-points{

    display:grid;

    gap:14px;

    margin:30px 0 34px;
}

.about-point{

    display:flex;

    gap:12px;

    align-items:center;

    color:var(--charcoal);

    font-size:13px;

    font-weight:600;
}

.about-point i{
    color:var(--brown);
}


/* =========================================================
   SERVICES
========================================================= */

.services{
    background:#ebe4d9;
}

.services-grid{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:20px;
}

.service-card{

    background:var(--cream-light);

    padding:36px;

    min-height:290px;

    border:1px solid rgba(99,74,52,.12);

    position:relative;

    transition:.35s ease;

    overflow:hidden;
}

.service-card::before{

    content:"";

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:3px;

    background:var(--brown);

    transform:scaleX(0);

    transform-origin:left;

    transition:.35s ease;
}

.service-card:hover{

    transform:translateY(-9px);

    box-shadow:var(--shadow);
}

.service-card:hover::before{
    transform:scaleX(1);
}

.service-number{

    font-family:"Playfair Display";

    font-size:14px;

    color:var(--brown);

    margin-bottom:30px;
}

.service-icon{

    width:50px;
    height:50px;

    display:grid;
    place-items:center;

    background:#e8dfd2;

    color:var(--brown);

    border-radius:50%;

    margin-bottom:23px;
}
